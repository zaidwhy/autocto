<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="autocto pipeline: git history and the source tree feed four analyzers (hotspots, duplicates, maintenance cost, architectural debt); a fifth, the migration planner, orders human-proposed changes with a topological sort. Sample output: run against the recall repo, frontend/src/App.jsx scores 5289 (churn 41 times complexity 129).">
