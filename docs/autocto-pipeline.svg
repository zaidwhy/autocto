  The sample numbers are real: autocto hotspots ../recall, limit 3,
  run on 2026-09-27 against a local checkout of zaidwhy/recall.
  Formulas are the ones in src/autocto/*.py.

  Hand-authored artwork. Animation degrades gracefully: static attribute
  values are the finished state.
  ============================================================================
-->
<defs>
<clipPath id="ac-clip"><rect x="0" y="0" width="900" height="430" rx="10"/></clipPath>
<path id="ac-a" d="M232 128 C 262 128, 268 110, 298 110" fill="none"/>
<path id="ac-b" d="M232 128 C 262 128, 268 222, 298 222" fill="none"/>
<path id="ac-c" d="M232 218 C 262 218, 268 166, 298 166" fill="none"/>
<path id="ac-d" d="M232 218 C 262 218, 268 278, 298 278" fill="none"/>
<path id="ac-e" d="M232 350 H 298" fill="none"/>
<path id="ac-o" d="M592 194 H 632" fill="none"/>
</defs>

<g clip-path="url(#ac-clip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
<rect x="0" y="0" width="900" height="430" fill="#0B0E14"/>

<text x="40" y="36" fill="#E9EEF5" font-size="17" font-weight="700" letter-spacing="1.6">AUTOCTO</text>
<text x="40" y="57" fill="#7D8794" font-size="11.5">Where the engineering risk lives, read from git history and the tree alone. No LLM, no network.</text>

<!-- inputs -->
<g>
<rect x="40" y="100" width="192" height="56" rx="8" fill="#0E141C" stroke="#1B2430" stroke-width="1.5"/>
<text x="56" y="124" fill="#E9EEF5" font-size="12.5" font-weight="700">git history</text>
<text x="56" y="143" fill="#7D8794" font-size="10.5">git log --numstat</text>

<rect x="40" y="190" width="192" height="56" rx="8" fill="#0E141C" stroke="#1B2430" stroke-width="1.5"/>
<text x="56" y="214" fill="#E9EEF5" font-size="12.5" font-weight="700">source tree</text>
<text x="56" y="233" fill="#7D8794" font-size="10.5">.py .js .ts .jsx .tsx</text>

<rect x="40" y="322" width="192" height="56" rx="8" fill="#0E141C" stroke="#1B2430" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="56" y="346" fill="#E9EEF5" font-size="12.5" font-weight="700">proposed changes</text>
<text x="56" y="365" fill="#7D8794" font-size="10.5">written by a human</text>
</g>

<!-- connectors -->
<g stroke="#2A3542" stroke-width="1.5" fill="none">
<use href="#ac-a"/><use href="#ac-b"/><use href="#ac-c"/><use href="#ac-d"/><use href="#ac-e"/><use href="#ac-o"/>
<path d="M232 218 C 262 218, 268 110, 298 110"/>
<path d="M232 218 C 262 218, 268 222, 298 222"/>
</g>

<g fill="#F5B942">
<circle r="3"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#ac-a"/></animateMotion></circle>
<circle r="3"><animateMotion dur="2.6s" begin="0.65s" repeatCount="indefinite"><mpath href="#ac-c"/></animateMotion></circle>
<circle r="3"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#ac-b"/></animateMotion></circle>
<circle r="3"><animateMotion dur="2.6s" begin="1.95s" repeatCount="indefinite"><mpath href="#ac-d"/></animateMotion></circle>
</g>

<!-- analyzers -->
<g>
<rect x="298" y="88" width="294" height="44" rx="7" fill="#15120A" stroke="#F5B942" stroke-width="1.5"/>
<text x="312" y="107" fill="#F5B942" font-size="12" font-weight="700">hotspots</text>
<text x="312" y="123" fill="#9AA5B1" font-size="10.5">churn x complexity</text>

<rect x="298" y="144" width="294" height="44" rx="7" fill="#0E141C" stroke="#3A3222" stroke-width="1.5"/>
<text x="312" y="163" fill="#E9EEF5" font-size="12" font-weight="700">duplicates</text>
<text x="312" y="179" fill="#9AA5B1" font-size="10.5">token-shingle Jaccard similarity</text>

<rect x="298" y="200" width="294" height="44" rx="7" fill="#0E141C" stroke="#3A3222" stroke-width="1.5"/>
<text x="312" y="219" fill="#E9EEF5" font-size="12" font-weight="700">maintenance cost</text>
<text x="312" y="235" fill="#9AA5B1" font-size="10.5">size x churn x (1 + fan-in)</text>

<rect x="298" y="256" width="294" height="44" rx="7" fill="#0E141C" stroke="#3A3222" stroke-width="1.5"/>
<text x="312" y="275" fill="#E9EEF5" font-size="12" font-weight="700">architectural debt</text>
<text x="312" y="291" fill="#9AA5B1" font-size="10.5">Tarjan cycles, god files, layering</text>

<rect x="298" y="328" width="294" height="44" rx="7" fill="#0E141C" stroke="#3A3222" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="312" y="347" fill="#E9EEF5" font-size="12" font-weight="700">migration plan</text>
<text x="312" y="363" fill="#9AA5B1" font-size="10.5">Kahn topological sort, never reads a repo</text>
</g>

<!-- sample output -->
<g>
<rect x="632" y="88" width="238" height="212" rx="8" fill="#07090D" stroke="#1B2430" stroke-width="1.5"/>
<text x="646" y="110" fill="#F5B942" font-size="10.5">$ autocto hotspots ../recall</text>
<text y="138" fill="#4A5563" font-size="10"><tspan x="646">path</tspan><tspan x="776" text-anchor="end">churn</tspan><tspan x="816" text-anchor="end">cplx</tspan><tspan x="856" text-anchor="end">score</tspan></text>
<text y="160" fill="#E9EEF5" font-size="10.5"><tspan x="646">App.jsx</tspan><tspan x="776" text-anchor="end">41</tspan><tspan x="816" text-anchor="end">129</tspan><tspan x="856" text-anchor="end">5289</tspan></text>
<text y="180" fill="#C9D1DB" font-size="10.5"><tspan x="646">main.py</tspan><tspan x="776" text-anchor="end">41</tspan><tspan x="816" text-anchor="end">89</tspan><tspan x="856" text-anchor="end">3649</tspan></text>
<text y="200" fill="#9AA5B1" font-size="10.5"><tspan x="646">memory.py</tspan><tspan x="776" text-anchor="end">11</tspan><tspan x="816" text-anchor="end">49</tspan><tspan x="856" text-anchor="end">539</tspan></text>
<rect x="646" y="214" width="210" height="6" rx="3" fill="#F5B942"/>
<rect x="646" y="226" width="145" height="6" rx="3" fill="#B98A33"/>
<rect x="646" y="238" width="21" height="6" rx="3" fill="#6B5424"/>
<text x="646" y="268" fill="#7D8794" font-size="10">most-changed AND most-branchy:</text>
<text x="646" y="284" fill="#7D8794" font-size="10">the file to review first</text>
</g>

<text x="632" y="326" fill="#7D8794" font-size="10.5">each repo analyzer: one</text>
<text x="632" y="342" fill="#7D8794" font-size="10.5">effectful analyze_repo(), pure</text>
<text x="632" y="358" fill="#7D8794" font-size="10.5">functions underneath; --json</text>
<text x="632" y="374" fill="#7D8794" font-size="10.5">on every CLI subcommand</text>

<!-- plate line -->
<rect x="0" y="406" width="900" height="24" fill="#070A0F"/>
<text x="40" y="422" fill="#4A5563" font-size="10" letter-spacing="2.2">AUTOCTO  ·  ORIGINAL WORK OF ZAID ALI SYED  ·  ORCID 0009-0003-4313-1510  ·  MMXXVI</text>
</g>
</svg>
