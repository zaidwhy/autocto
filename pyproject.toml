[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-autocto"
version = "0.1.0"
description = "Automated CTO: repository health analyzers over a codebase and its git history."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Zaid Ali Syed" }]
license = { text = "MIT" }
dependencies = []

[project.urls]
Repository = "https://github.com/zaidwhy/autocto"

[project.scripts]
autocto = "autocto.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
